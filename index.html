<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Down...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6; 
            font-family: 'Arial', sans-serif;
            text-align: center;
            color: #ff4d4d;
            overflow: hidden; /* Prevents scrollbars from the floating hearts */
            position: relative;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            z-index: 10; /* Keeps text above hearts */
        }

        #timer {
            font-size: 3rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #ff6b6b;
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            z-index: 10;
        }

        .time-segment {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .label {
            font-size: 0.8rem;
            color: #888;
            font-weight: normal;
        }

        .btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 10;
        }

        #fake-reveal-btn {
            background-color: #ff8c8c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #reveal-btn {
            display: none; 
            background-color: #ff4757;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            animation: pulse 2s infinite;
        }

        #nice-try-msg {
            display: none;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #d63031;
            z-index: 10;
        }

        #surprise-img {
            display: none;
            max-width: 90%;
            max-height: 80vh;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            animation: fadeIn 1s ease-in;
            z-index: 20;
        }

        /* --- Floating Hearts Styling --- */
        .heart {
            position: absolute;
            bottom: -20px;
            color: #ff4d4d;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <h1 id="main-title">Surprise in:</h1>

    <div id="timer">
        <div class="time-segment"><span id="days">00</span><span class="label">Days</span></div> :
        <div class="time-segment"><span id="hours">00</span><span class="label">Hrs</span></div> :
        <div class="time-segment"><span id="minutes">00</span><span class="label">Mins</span></div> :
        <div class="time-segment"><span id="seconds">00</span><span class="label">Secs</span></div>
    </div>

    <button id="fake-reveal-btn" class="btn">Reveal Surprise</button>
    <div id="nice-try-msg">Nice Try!!! See you soon</div>

    <button id="reveal-btn" class="btn">Click Here ❤️</button>

    <img id="surprise-img" src="IMG_0197.jpg" alt="Surprise!">

    <script>
        const countToDate = new Date("Feb 14, 2026 00:00:00").getTime();
        const testingMode = false; 

        const timerElement = document.getElementById('timer');
        const titleElement = document.getElementById('main-title');
        const buttonElement = document.getElementById('reveal-btn');
        const fakeButton = document.getElementById('fake-reveal-btn');
        const niceTryMsg = document.getElementById('nice-try-msg');
        const imageElement = document.getElementById('surprise-img');

        // Heart Animation Logic
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's'; // Between 2-5 seconds
            heart.style.opacity = Math.random();
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            
            document.body.appendChild(heart);

            // Remove heart after animation ends so the page doesn't get slow
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // Spawn a heart every 300ms
        setInterval(createHeart, 300);

        // Fake Button Logic
        fakeButton.addEventListener('click', function() {
            niceTryMsg.style.display = "block";
        });

        // Countdown Logic
        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countToDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = String(days).padStart(2, '0');
            document.getElementById("hours").innerHTML = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerHTML = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerHTML = String(seconds).padStart(2, '0');

            if (distance < 0 || testingMode) {
                clearInterval(x);
                timerElement.style.display = "none";
                fakeButton.style.display = "none";
                niceTryMsg.style.display = "none";
                titleElement.innerHTML = "I have something for you...";
                buttonElement.style.display = "block";
            }
        }, 1000);

        buttonElement.addEventListener('click', function() {
            this.style.display = "none";
            titleElement.style.display = "none";
            imageElement.style.display = "block";
        });
    </script>
</body>
</html>
