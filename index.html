<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Afsana...</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh; background-color: #ffe6e6; 
            font-family: 'Arial', sans-serif; text-align: center;
            color: #ff4d4d; overflow: hidden; position: relative;
        }

        /* Section Visibility */
        #invite-section { display: flex; flex-direction: column; align-items: center; z-index: 100; width: 100%; height: 100%; justify-content: center; }
        #countdown-section { display: none; flex-direction: column; align-items: center; }

        h1 { font-size: 2.5rem; margin-bottom: 40px; z-index: 10; padding: 0 20px; }

        /* Button Layout */
        .btn-container { 
            display: flex; 
            gap: 100px; /* Increased separation */
            margin-top: 20px; 
            align-items: center;
            justify-content: center;
            min-height: 100px;
        }
        
        .btn {
            padding: 15px 35px; font-size: 1.3rem; color: white;
            border: none; border-radius: 50px; cursor: pointer;
            transition: transform 0.2s; z-index: 10;
        }

        #yes-btn { 
            background-color: #ff4757; 
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4); 
        }

        #no-btn { 
            background-color: #95a5a6; 
            position: relative; /* Starts in place, then goes absolute */
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            white-space: nowrap;
        }

        /* Existing Styles */
        #timer {
            font-size: 2.5rem; font-weight: bold;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 25px; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            color: #ff6b6b; display: flex; gap: 10px;
            margin-bottom: 30px; z-index: 10;
        }
        .time-segment { display: flex; flex-direction: column; align-items: center; }
        .label { font-size: 0.7rem; color: #888; text-transform: uppercase; }
        
        #fake-reveal-btn { background-color: #ff8c8c; }
        #reveal-btn { display: none; background-color: #ff4757; animation: pulse 2s infinite; }
        #nice-try-msg { display: none; margin-top: 25px; font-size: 1.3rem; font-weight: bold; color: #d63031; }
        #surprise-img { display: none; max-width: 90%; max-height: 70vh; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: fadeIn 1s ease-in; }

        /* Heart Animations */
        .heart { position: absolute; color: #ff4d4d; user-select: none; pointer-events: none; }
        .float-heart { bottom: -20px; animation: floatUp linear forwards; }
        .burst-heart { top: 50%; left: 50%; animation: burstOut 1.5s ease-out forwards; }

        @keyframes floatUp { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; } }
        
        @keyframes burstOut {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(1.5) rotate(var(--r)); opacity: 0; }
        }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 500px) {
            .btn-container { gap: 40px; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div id="invite-section">
        <h1>Afsana, will you be my Valentine? ❤️</h1>
        <div class="btn-container">
            <button id="yes-btn" class="btn">YES!</button>
            <button id="no-btn" class="btn">No ☹️ you hate me</button>
        </div>
    </div>

    <div id="countdown-section">
        <h1 id="main-title">Surprise in:</h1>
        <div id="timer">
            <div class="time-segment"><span id="days">00</span><span class="label">Days</span></div> :
            <div class="time-segment"><span id="hours">00</span><span class="label">Hrs</span></div> :
            <div class="time-segment"><span id="minutes">00</span><span class="label">Mins</span></div> :
            <div class="time-segment"><span id="seconds">00</span><span class="label">Secs</span></div>
        </div>
        <button id="fake-reveal-btn" class="btn">Reveal Surprise Early</button>
        <div id="nice-try-msg">Nice Try Afsana!!! See you soon ❤️</div>
        <button id="reveal-btn" class="btn">Click Here ❤️</button>
        <img id="surprise-img" src="IMG_0197.jpg" alt="Surprise!">
    </div>

    <audio id="bg-music" src="music.mp3" loop></audio>
    <audio id="victory-sound" src="victory.mp3"></audio>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const inviteSection = document.getElementById('invite-section');
        const countdownSection = document.getElementById('countdown-section');
        const victorySound = document.getElementById('victory-sound');

        // NO button evasion
        const moveNoButton = () => {
            // Switch to absolute positioning on first move
            noBtn.style.position = 'absolute';
            
            // Calculate padding to keep button away from the very edge
            const padding = 50;
            const maxWidth = window.innerWidth - noBtn.offsetWidth - padding;
            const maxHeight = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.random() * maxWidth);
            const randomY = Math.max(padding, Math.random() * maxHeight);

            noBtn.style.left = `${randomX}px`;
            noBtn.style.top = `${randomY}px`;
        };

        noBtn.addEventListener('mouseover', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents clicking it while jumping on mobile
            moveNoButton();
        });

        function createVictoryBurst() {
            for(let i=0; i<30; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart', 'burst-heart');
                heart.innerHTML = '❤️';
                heart.style.setProperty('--x', `${(Math.random() - 0.5) * 600}px`);
                heart.style.setProperty('--y', `${(Math.random() - 0.5) * 600}px`);
                heart.style.setProperty('--r', `${Math.random() * 360}deg`);
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1500);
            }
        }

        yesBtn.addEventListener('click', () => {
            createVictoryBurst();
            victorySound.play().catch(() => {});
            setTimeout(() => {
                inviteSection.style.display = 'none';
                countdownSection.style.display = 'flex';
            }, 600);
        });

        function createFloatHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart', 'float-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.opacity = Math.random();
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
        setInterval(createFloatHeart, 400);

        const countToDate = new Date("Feb 14, 2026 00:00:00").getTime();
        const testingMode = false; 

        const timerElement = document.getElementById('timer');
        const titleElement = document.getElementById('main-title');
        const buttonElement = document.getElementById('reveal-btn');
        const fakeButton = document.getElementById('fake-reveal-btn');
        const niceTryMsg = document.getElementById('nice-try-msg');
        const imageElement = document.getElementById('surprise-img');
        const music = document.getElementById('bg-music');

        fakeButton.addEventListener('click', () => { niceTryMsg.style.display = "block"; });

        const x = setInterval(function() {
            const now = new Date().getTime();
            const distance = countToDate - now;
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = String(days).padStart(2, '0');
            document.getElementById("hours").innerHTML = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerHTML = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerHTML = String(seconds).padStart(2, '0');

            if (distance < 0 || testingMode) {
                clearInterval(x);
                timerElement.style.display = "none";
                fakeButton.style.display = "none";
                niceTryMsg.style.display = "none";
                titleElement.innerHTML = "I have something for you, Afsana...";
                buttonElement.style.display = "block";
            }
        }, 1000);

        buttonElement.addEventListener('click', function() {
            this.style.display = "none";
            titleElement.style.display = "none";
            imageElement.style.display = "block";
            music.play();
        });
    </script>
</body>
</html>
